name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: money_manager
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: money_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money_manager -d money_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://money_manager:changeme@localhost:5432/money_manager
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long-here
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long-here
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Migrate database
        run: pnpm --filter @money-manager/db run db:migrate:runtime

      - name: Test
        run: pnpm test

      # Persist push before/after so CD can diff multi-commit pushes (workflow_run has no push payload).
      - name: Record push range for CD
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p deploy-range
          echo "${{ github.event.before }}" > deploy-range/before
          echo "${{ github.event.after }}" > deploy-range/after

      - name: Upload push range artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-range-${{ github.sha }}
          path: deploy-range/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: money_manager
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: money_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money_manager -d money_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://money_manager:changeme@localhost:5432/money_manager
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long-here
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long-here
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173
      INTERNAL_API_KEY: ci-internal-api-key-change-me
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
