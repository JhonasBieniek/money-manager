name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Resolve deploy SHA
        id: meta
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_prefix=ghcr.io/${OWNER_LC}/money-manager" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  resolve-baselines:
    needs: meta
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api: ${{ steps.resolve.outputs.api }}
      web: ${{ steps.resolve.outputs.web }}
      bot: ${{ steps.resolve.outputs.bot }}
      stt: ${{ steps.resolve.outputs.stt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.deploy_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'workflow_dispatch'

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each service's build/retag decision diffs against the commit actually baked
      # into its own :latest image (read back from a label on the image in GHCR) —
      # not the previous push. This stays correct across streaks of failed/skipped
      # CI, where "the previous push" and "the last commit actually built" diverge.
      - name: Resolve per-service baselines and detect changes
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SHA: ${{ needs.meta.outputs.deploy_sha }}
          IMAGE_PREFIX: ${{ needs.meta.outputs.image_prefix }}
        run: |
          # Disable pathname expansion: the "**" globs below must reach `git diff`
          # as literal pathspecs so git can interpret them recursively itself. Left
          # enabled, bash pre-expands them against the checked-out worktree's current
          # disk state instead, silently dropping any path deleted since the baseline.
          set -f

          SHARED_GLOBS="package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json eslint.config.mjs"
          WORKFLOW_GLOBS=".github/workflows/cd.yml .github/workflows/ci.yml"

          service_globs() {
            case "$1" in
              api) echo "apps/api/** packages/db/** packages/types/** packages/utils/** apps/api/Dockerfile $SHARED_GLOBS $WORKFLOW_GLOBS" ;;
              web) echo "apps/web/** packages/types/** packages/utils/** apps/web/Dockerfile $SHARED_GLOBS $WORKFLOW_GLOBS" ;;
              bot) echo "apps/bot/** apps/bot/Dockerfile $SHARED_GLOBS $WORKFLOW_GLOBS" ;;
              stt) echo "apps/stt/** $WORKFLOW_GLOBS" ;;
            esac
          }

          # Labels can live at two different depths depending on whether the tag resolves
          # to a single-manifest image (.image.config.Labels) or a multi-platform index
          # (.image.<platform>.config.Labels) — provenance attestations (on by default in
          # docker/build-push-action@v7) attach an extra manifest even for our single-
          # platform (linux/arm64) builds, so either shape can occur. Try flat first, then
          # fall back to the arm64-keyed map.
          baseline_sha() {
            local service="$1"
            local image="${IMAGE_PREFIX}-${service}"
            local label
            label="$(docker buildx imagetools inspect "${image}:latest" --format '{{json .}}' 2>/dev/null | jq -r '(.image.config.Labels // .image["linux/arm64"].config.Labels // {}) | .["org.opencontainers.image.revision"] // empty' 2>/dev/null || true)"
            if [[ -n "$label" ]] && git cat-file -e "${label}^{commit}" 2>/dev/null; then
              echo "$label"
            fi
            return 0
          }

          for service in api web bot stt; do
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "==> ${service}: workflow_dispatch, forcing build"
              echo "${service}=true" >> "$GITHUB_OUTPUT"
              continue
            fi

            base="$(baseline_sha "$service")"
            if [[ -z "$base" ]]; then
              echo "==> ${service}: no valid baseline found, forcing build"
              echo "${service}=true" >> "$GITHUB_OUTPUT"
              continue
            fi

            if git diff --quiet "$base" "$DEPLOY_SHA" -- $(service_globs "$service"); then
              echo "==> ${service}: unchanged since ${base}"
              echo "${service}=false" >> "$GITHUB_OUTPUT"
            else
              echo "==> ${service}: changed since ${base}"
              echo "${service}=true" >> "$GITHUB_OUTPUT"
            fi
          done

  # matrix.* is not available in job-level if — resolve service lists here instead.
  resolve-matrix:
    needs: [meta, resolve-baselines]
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      needs.resolve-baselines.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      build_services: ${{ steps.resolve.outputs.build_services }}
      retag_services: ${{ steps.resolve.outputs.retag_services }}
    steps:
      - name: Partition services into build/retag matrices
        id: resolve
        env:
          API_CHANGED: ${{ needs.resolve-baselines.outputs.api }}
          WEB_CHANGED: ${{ needs.resolve-baselines.outputs.web }}
          BOT_CHANGED: ${{ needs.resolve-baselines.outputs.bot }}
          STT_CHANGED: ${{ needs.resolve-baselines.outputs.stt }}
        run: |
          build=()
          retag=()

          for service in api web bot stt; do
            case "$service" in
              api) changed="$API_CHANGED" ;;
              web) changed="$WEB_CHANGED" ;;
              bot) changed="$BOT_CHANGED" ;;
              stt) changed="$STT_CHANGED" ;;
            esac

            if [[ "$changed" == "true" ]]; then
              build+=("$service")
            else
              retag+=("$service")
            fi
          done

          if [[ ${#build[@]} -eq 0 ]]; then
            echo "build_services=[]" >> "$GITHUB_OUTPUT"
          else
            echo "build_services=$(jq -nc --args '$ARGS.positional' "${build[@]}")" >> "$GITHUB_OUTPUT"
          fi

          if [[ ${#retag[@]} -eq 0 ]]; then
            echo "retag_services=[]" >> "$GITHUB_OUTPUT"
          else
            echo "retag_services=$(jq -nc --args '$ARGS.positional' "${retag[@]}")" >> "$GITHUB_OUTPUT"
          fi

          echo "Build: ${build[*]:-none}"
          echo "Retag: ${retag[*]:-none}"

  build:
    name: build ${{ matrix.service }}
    needs: [meta, resolve-baselines, resolve-matrix]
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      needs.resolve-baselines.result == 'success' &&
      needs.resolve-matrix.result == 'success' &&
      needs.resolve-matrix.outputs.build_services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve-matrix.outputs.build_services) }}

    steps:
      - name: Resolve image config
        id: config
        run: |
          case "${{ matrix.service }}" in
            api)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=apps/api/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            web)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            bot)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=apps/bot/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            stt)
              echo "context=apps/stt" >> "$GITHUB_OUTPUT"
              echo "file=apps/stt/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown service: ${{ matrix.service }}" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.deploy_sha }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build args
        id: buildargs
        run: |
          case "${{ matrix.service }}" in
            web)
              {
                echo "args<<EOF"
                echo "VITE_API_URL=https://${{ secrets.DOMAIN }}"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            stt)
              {
                echo "args<<EOF"
                echo "STT_MODEL=${{ vars.STT_MODEL || 'small' }}"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "args=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push ${{ matrix.service }} image (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.file }}
          platforms: linux/arm64
          push: true
          build-args: ${{ steps.buildargs.outputs.args != '' && steps.buildargs.outputs.args || '' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.meta.outputs.deploy_sha }}
          tags: |
            ${{ needs.meta.outputs.image_prefix }}-${{ matrix.service }}:${{ needs.meta.outputs.deploy_sha }}
            ${{ needs.meta.outputs.image_prefix }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Unchanged images are retagged (latest -> deploy SHA) without rebuilding.
  retag:
    name: retag ${{ matrix.service }}
    needs: [meta, resolve-baselines, build, resolve-matrix]
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      needs.resolve-baselines.result == 'success' &&
      needs.resolve-matrix.result == 'success' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled' &&
      needs.resolve-matrix.outputs.retag_services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve-matrix.outputs.retag_services) }}

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag ${{ matrix.service }} (latest -> deploy SHA)
        run: |
          IMAGE="${{ needs.meta.outputs.image_prefix }}-${{ matrix.service }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ needs.meta.outputs.deploy_sha }}" \
            "${IMAGE}:latest"

  deploy:
    needs: [meta, build, retag, resolve-matrix]
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      needs.resolve-matrix.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.retag.result == 'success' || needs.retag.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.meta.outputs.deploy_sha }}
          MM_IMAGE_PREFIX: ${{ needs.meta.outputs.image_prefix }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_SHA,MM_IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail

            COMPOSE_FILE="docker/compose.prod.yml"
            ENV_FILE=".env.prod"
            WAIT_TIMEOUT=600

            if [[ -z "${DEPLOY_PATH:-}" ]]; then
              echo "DEPLOY_PATH secret is required." >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [[ ! -f "$ENV_FILE" ]]; then
              echo "Missing $ENV_FILE on server." >&2
              exit 1
            fi

            if ! docker network inspect portfolio >/dev/null 2>&1; then
              echo "Docker network 'portfolio' not found. Start /opt/postgres first." >&2
              exit 1
            fi

            set -a
            # shellcheck disable=SC1091
            source "$ENV_FILE"
            set +a

            if [[ -z "${DOMAIN:-}" ]]; then
              echo "Missing DOMAIN in $ENV_FILE" >&2
              exit 1
            fi

            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              echo "==> Logging in to GHCR"
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-github}" --password-stdin
            fi

            PREVIOUS_SHA="$(git rev-parse HEAD)"
            export MM_IMAGE_PREFIX="${MM_IMAGE_PREFIX}"
            export MM_IMAGE_TAG="$DEPLOY_SHA"
            ROLLBACK_NEEDED=0

            rollback() {
              if [[ "$ROLLBACK_NEEDED" -ne 1 ]]; then
                return 0
              fi
              echo "==> Deploy failed — rolling back to ${PREVIOUS_SHA}"
              git reset --hard "$PREVIOUS_SHA"
              export MM_IMAGE_TAG="$PREVIOUS_SHA"
              docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull || true
              docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --wait --wait-timeout "$WAIT_TIMEOUT" || true
            }

            trap rollback EXIT

            echo "==> Deploying commit ${DEPLOY_SHA} (previous: ${PREVIOUS_SHA})"
            git fetch origin
            git reset --hard "$DEPLOY_SHA"
            ROLLBACK_NEEDED=1

            echo "==> Pulling images ${MM_IMAGE_PREFIX}-*:${MM_IMAGE_TAG}"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull

            echo "==> Starting services (waiting for healthchecks)..."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --wait --wait-timeout "$WAIT_TIMEOUT"

            echo "==> Health check (via Caddy)"
            HEALTH_OK=0
            for i in $(seq 1 18); do
              if curl -fsS "https://${DOMAIN}/health" >/dev/null; then
                HEALTH_OK=1
                echo "Health check passed (attempt ${i}/18)"
                break
              fi
              echo "Health check attempt ${i}/18 failed, retrying in 10s..."
              sleep 10
            done

            if [[ "$HEALTH_OK" -ne 1 ]]; then
              echo "Health check failed after 18 attempts." >&2
              exit 1
            fi

            echo "==> Service status"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps

            echo "==> Pruning unused images"
            docker image prune -f

            ROLLBACK_NEEDED=0
            trap - EXIT
            echo "==> Deploy complete: ${DEPLOY_SHA}"
