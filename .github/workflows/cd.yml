name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}

    steps:
      - name: Resolve deploy SHA
        id: meta
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_prefix=ghcr.io/${OWNER_LC}/money-manager" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.deploy_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-api:${{ steps.meta.outputs.deploy_sha }}
            ${{ steps.meta.outputs.image_prefix }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=https://${{ secrets.DOMAIN }}
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-web:${{ steps.meta.outputs.deploy_sha }}
            ${{ steps.meta.outputs.image_prefix }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Bot image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-bot:${{ steps.meta.outputs.deploy_sha }}
            ${{ steps.meta.outputs.image_prefix }}-bot:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Build and push STT image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: apps/stt
          file: apps/stt/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            STT_MODEL=${{ vars.STT_MODEL || 'small' }}
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-stt:${{ steps.meta.outputs.deploy_sha }}
            ${{ steps.meta.outputs.image_prefix }}-stt:latest
          cache-from: type=gha,scope=stt
          cache-to: type=gha,mode=max,scope=stt

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.build-and-push.outputs.deploy_sha }}
          MM_IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_SHA,MM_IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            set -euo pipefail

            COMPOSE_FILE="docker/compose.prod.yml"
            ENV_FILE=".env.prod"
            WAIT_TIMEOUT=600

            if [[ -z "${DEPLOY_PATH:-}" ]]; then
              echo "DEPLOY_PATH secret is required." >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [[ ! -f "$ENV_FILE" ]]; then
              echo "Missing $ENV_FILE on server." >&2
              exit 1
            fi

            if ! docker network inspect portfolio >/dev/null 2>&1; then
              echo "Docker network 'portfolio' not found. Start /opt/postgres first." >&2
              exit 1
            fi

            set -a
            # shellcheck disable=SC1091
            source "$ENV_FILE"
            set +a

            if [[ -z "${DOMAIN:-}" ]]; then
              echo "Missing DOMAIN in $ENV_FILE" >&2
              exit 1
            fi

            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              echo "==> Logging in to GHCR"
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-github}" --password-stdin
            fi

            PREVIOUS_SHA="$(git rev-parse HEAD)"
            export MM_IMAGE_PREFIX="${MM_IMAGE_PREFIX}"
            export MM_IMAGE_TAG="$DEPLOY_SHA"
            ROLLBACK_NEEDED=0

            rollback() {
              if [[ "$ROLLBACK_NEEDED" -ne 1 ]]; then
                return 0
              fi
              echo "==> Deploy failed — rolling back to ${PREVIOUS_SHA}"
              git reset --hard "$PREVIOUS_SHA"
              export MM_IMAGE_TAG="$PREVIOUS_SHA"
              docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull || true
              docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --wait --wait-timeout "$WAIT_TIMEOUT" || true
            }

            trap rollback EXIT

            echo "==> Deploying commit ${DEPLOY_SHA} (previous: ${PREVIOUS_SHA})"
            git fetch origin
            git reset --hard "$DEPLOY_SHA"
            ROLLBACK_NEEDED=1

            echo "==> Pulling images ${MM_IMAGE_PREFIX}-*:${MM_IMAGE_TAG}"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull

            echo "==> Starting services (waiting for healthchecks)..."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --wait --wait-timeout "$WAIT_TIMEOUT"

            echo "==> Health check (via Caddy)"
            HEALTH_OK=0
            for i in $(seq 1 18); do
              if curl -fsS "https://${DOMAIN}/health" >/dev/null; then
                HEALTH_OK=1
                echo "Health check passed (attempt ${i}/18)"
                break
              fi
              echo "Health check attempt ${i}/18 failed, retrying in 10s..."
              sleep 10
            done

            if [[ "$HEALTH_OK" -ne 1 ]]; then
              echo "Health check failed after 18 attempts." >&2
              exit 1
            fi

            echo "==> Service status"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps

            echo "==> Pruning unused images"
            docker image prune -f

            ROLLBACK_NEEDED=0
            trap - EXIT
            echo "==> Deploy complete: ${DEPLOY_SHA}"
